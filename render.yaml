services:
  - type: web
    name: roleplay2026-webhook
    runtime: docker
    dockerfilePath: ./Dockerfile.webhook
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false

  - type: web
    name: roleplay2026-v2
    runtime: python
    plan: starter
    region: virginia
    branch: agent/narrative-engine-v2
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: >-
      streamlit run app.py
      --server.address 0.0.0.0
      --server.port $PORT
      --server.headless true
      --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    autoDeployTrigger: off
