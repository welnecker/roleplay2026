name: Build Media Timeline Editor Windows

on:
  workflow_dispatch:
  push:
    branches:
      - agent/legal-pages
    paths:
      - "tools/media_timeline_editor/**"
      - "tests/test_media_timeline_editor.py"
      - ".github/workflows/build-media-timeline-editor-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/media_timeline_editor/requirements-build.txt
      - name: Validate and test
        shell: pwsh
        run: |
          python -m py_compile tools/media_timeline_editor/core.py
          python -m py_compile tools/media_timeline_editor/app.py
          python -m pytest -q tests/test_media_timeline_editor.py
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name Editor_Midia_EntreCenas `
            --paths tools/media_timeline_editor `
            --hidden-import PIL.ImageTk `
            --collect-all imageio_ffmpeg `
            tools/media_timeline_editor/app.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Editor_Midia_EntreCenas.exe release/
          Copy-Item tools/media_timeline_editor/LEIA-ME.txt release/
          Compress-Archive -Path release/* -DestinationPath Editor_Midia_EntreCenas_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Editor_Midia_EntreCenas_Windows
          path: Editor_Midia_EntreCenas_Windows.zip
          if-no-files-found: error
