name: Build Card Configurator Windows

on:
  workflow_dispatch:
  push:
    branches:
      - agent/legal-pages
    paths:
      - "tools/card_editor_desktop/**"
      - "tests/test_card_editor_desktop.py"
      - ".github/workflows/build-card-configurator-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/card_editor_desktop/requirements-build.txt

      - name: Run card configurator tests
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_card_editor_desktop.py

      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Configurador_Cards_EntreCenas --paths tools/card_editor_desktop --hidden-import yaml --hidden-import PIL._tkinter_finder tools/card_editor_desktop/app.py

      - name: Package Windows tool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/Configurador_Cards_EntreCenas.exe package/
          Copy-Item tools/card_editor_desktop/LEIA-ME.txt package/
          Compress-Archive -Path package/* -DestinationPath Configurador_Cards_EntreCenas_Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Configurador_Cards_EntreCenas_Windows
          path: Configurador_Cards_EntreCenas_Windows.zip
          if-no-files-found: error
          retention-days: 30
