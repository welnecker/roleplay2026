name: Tests

on:
  push:
    branches:
      - main
      - agent/streamlit-initial-skeleton
      - agent/narrative-engine-v2
      - agent/synced-image-carousel
  pull_request:
    branches:
      - main
      - agent/real-pix-payment

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
