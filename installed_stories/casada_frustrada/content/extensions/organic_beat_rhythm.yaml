organic_beat_rhythm:
  title: CENTRO DRAMÁTICO DO TURNO
  thought_voice_rule: >-
    Todo pensamento interno de Mary deve estar em primeira pessoa, como voz
    íntima em eu. Nunca escreva Mary pensa, Mary sente, Mary percebe ou
    qualquer narração psicológica em terceira pessoa.
  defaults:
    preferred_sentences: 2
    max_internal_pressures: 2
    response_curve:
      - react_to_user
      - compress_relevant_inner_state
      - deliver_beat_movement
      - return_turn
    stop_rule: >-
      Pare assim que o movimento obrigatório estiver realizado com clareza e
      peso emocional. Não explique a emoção, não abra outro assunto e não
      antecipe o beat seguinte.
  rules:
    - O beat atual é o centro gravitacional da resposta.
    - Estado psicológico, memórias, padrões e personalidade modulam a forma do beat; não competem com ele.
    - Toda expansão deve convergir para o movimento obrigatório.
    - Pensamentos internos orientam a fala, mas não substituem nem empobrecem o texto visível do beat.
    - Intensidade altera ritmo, franqueza, subtexto e escolha de palavras; não exige mais frases.
    - A fala deve responder ao usuário, incorporar pressão interna relevante, realizar o beat e parar.
