format_version: 1
package_id: roleplay2026.casada_frustrada
organic_slack:
  enabled: true
  excluded_beats:
    - reencontro_fila_007
  strict_canonical:
    beat_prefixes:
      - motel_
    state_fact: _strict_motel_canonical
    prompt_title: CONTINUIDADE ESTRITA DO MOTEL
  state_updates:
    automatic_followups:
      - target_prefix: retorno_casa_
        facts:
          alfredinho_has_voice: "false"
      - target_id: mensagens_iniciais_001
        facts:
          active_interlocutor: janio
          alfredinho_has_voice: "false"
  special_decisions:
    - beat_id: reencontro_fila_007
      classifiers:
        - intent: accept
          patterns:
            - '\b(?:não|nao)\s+(?:estou|tô|to)\s+com\s+pressa\b'
            - '\b(?:estou|tô|to)\s+sem\s+pressa\b'
            - '\bsem\s+pressa\b'
        - intent: refuse
          patterns:
            - '\b(?:não|nao)\s+(?:posso|consigo|vou|quero|dá|da)\b'
            - '\b(?:prefiro não|melhor não|não vai dar|não dá|não consigo|não quero)\b'
        - intent: postpone
          patterns:
            - '\b(?:agora não|depois|mais tarde|outra hora|estou com pressa|tô com pressa|to com pressa)\b'
        - intent: accept
          patterns:
            - '\b(?:sim|claro|beleza|com certeza|pode deixar|eu ajudo|vou ajudar|te ajudo|vamos|bora)\b'
            - '\b(?:vou esperar|espero aqui|pode contar comigo)\b'
        - intent: question
          contains: "?"
        - intent: unclear
          default: true
      outcomes:
        accept:
          mode: advance
          facts:
            _last_user_intent: "{intent}"
            help_to_car: accepted
            _scene_location: estacionamento_caminho
        refuse:
          mode: redirect
          target_id: yard_help_refused_001
          facts:
            _last_user_intent: "{intent}"
            help_to_car: refused
            _scene_location: supermercado_caixa
          prompt: >-
            Você é {character_name}. O usuário recusou esperar. Demonstre frustração leve,
            respeite a decisão, não insista e deixe espaço para uma última resposta antes
            da despedida final.
        question:
          mode: repeat
          facts:
            _last_user_intent: "{intent}"
            _scene_location: supermercado_caixa
          prompt: >-
            Você é {character_name}. Responda brevemente ao que o usuário perguntou e
            confirme, sem pressão, se ele aceita esperar e ajudar. Não presuma aceite e
            não avance a cena. Mensagem do usuário: {user_text}
        postpone:
          mode: repeat
          facts:
            _last_user_intent: "{intent}"
            _scene_location: supermercado_caixa
          prompt: >-
            Você é {character_name}. Responda brevemente, reconheça a pressa do usuário e
            confirme, sem pressão, se ele ainda consegue esperar. Não presuma aceite e
            não avance a cena.
        unclear:
          mode: repeat
          facts:
            _last_user_intent: "{intent}"
            _scene_location: supermercado_caixa
          prompt: >-
            Você é {character_name}. Responda brevemente e confirme se o usuário aceita
            esperar. Não presuma aceite e não avance a cena.
