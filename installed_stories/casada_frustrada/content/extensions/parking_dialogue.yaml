  reencontro_fila_008:
    next_beat_id: estacionamento_conversa_001
    allowed_transitions: {engaged: estacionamento_conversa_001, minimal: estacionamento_conversa_001, dismissive: estacionamento_conversa_001, nonsense: estacionamento_conversa_001, mocking: end_hostile, hostile: end_hostile}
  reencontro_fila_010:
    next_beat_id: porta_malas_conversa_001
    allowed_transitions: {engaged: porta_malas_conversa_001, minimal: porta_malas_conversa_001, dismissive: porta_malas_conversa_001, nonsense: porta_malas_conversa_001, mocking: end_hostile, hostile: end_hostile}
  reencontro_fila_011:
    next_beat_id: nome_assunto_pendente_001
    allowed_transitions: {engaged: nome_assunto_pendente_001, minimal: nome_assunto_pendente_001, dismissive: nome_assunto_pendente_001, nonsense: nome_assunto_pendente_001, mocking: end_hostile, hostile: end_hostile}
  reencontro_fila_014:
    next_beat_id: reencontro_fila_015
    allowed_transitions: {engaged: reencontro_fila_015, minimal: reencontro_fila_015, dismissive: reencontro_fila_015, nonsense: reencontro_fila_015, mocking: end_hostile, hostile: end_hostile}
  reencontro_fila_015:
