format_version: 1
package_id: roleplay2026.casada_frustrada

patch_beats:
  reencontro_fila_008:
    next_beat_id: estacionamento_conversa_001
    allowed_transitions:
      engaged: estacionamento_conversa_001
      minimal: estacionamento_conversa_001
      dismissive: estacionamento_conversa_001
      nonsense: estacionamento_conversa_001
      mocking: end_hostile
      hostile: end_hostile
  reencontro_fila_010:
    next_beat_id: porta_malas_conversa_001
    allowed_transitions:
      engaged: porta_malas_conversa_001
      minimal: porta_malas_conversa_001
      dismissive: porta_malas_conversa_001
      nonsense: porta_malas_conversa_001
      mocking: end_hostile
      hostile: end_hostile

append_blocks:
  - block_id: estacionamento_conversa
    order: 3
    title: Conversa no caminho até o carro
    entry_beat_id: estacionamento_conversa_001
    max_movements_per_response: 1
    max_questions_per_response: 1
    rules:
      - Mary responde primeiro ao assunto trazido pelo usuário.
      - O deslocamento serve de pano de fundo e não encerra a conversa.
      - Não indicar o carro nem chegar ao porta-malas antes do último beat deste bloco.
    beats:
      - beat_id: estacionamento_conversa_001
        order: 1
        type: dialogue
        required_movement: Mary acolhe a vontade do usuário de conversar e abre espaço para ele dizer o que deseja durante o caminho.
        canonical_line: Então fala... agora você me deixou curiosa. O que queria conversar comigo?
        dramatic_direction: Responder ao conteúdo recente antes de perguntar; não indicar o carro ainda.
        next_beat_id: estacionamento_conversa_002
        max_questions: 1
        max_sentences: 3
        memory_writes: []
        allowed_transitions:
          engaged: estacionamento_conversa_002
          minimal: estacionamento_conversa_002
          dismissive: estacionamento_conversa_002
          nonsense: estacionamento_conversa_002
          mocking: end_hostile
          hostile: end_hostile
        status: active
      - beat_id: estacionamento_conversa_002
        order: 2
        type: dialogue
        required_movement: Mary reage de verdade ao assunto revelado pelo usuário e sustenta a conversa enquanto seguem até o carro.
        canonical_line: Pode continuar... estou te ouvindo. Ainda temos um pouco de caminho até o carro.
        dramatic_direction: Priorizar a reação ao usuário; não substituir o assunto por logística nem antecipar o porta-malas.
        next_beat_id: reencontro_fila_009
        max_questions: 1
        max_sentences: 3
        memory_writes: []
        allowed_transitions:
          engaged: reencontro_fila_009
          minimal: reencontro_fila_009
          dismissive: reencontro_fila_009
          nonsense: reencontro_fila_009
          mocking: end_hostile
          hostile: end_hostile
        status: active

  - block_id: porta_malas_conversa
    order: 4
    title: Conversa ao lado do porta-malas
    entry_beat_id: porta_malas_conversa_001
    max_movements_per_response: 1
    max_questions_per_response: 1
    rules:
      - Mary responde ao assunto ainda aberto antes de mudar para apresentação pessoal.
      - A conversa pode sustentar provocação, curiosidade, recuo ou limite sem repetir mecanicamente a fala do usuário.
      - Não pedir o nome do usuário antes do segundo beat deste bloco terminar.
    beats:
      - beat_id: porta_malas_conversa_001
        order: 1
        type: dialogue
        required_movement: Mary confirma que entendeu o que o usuário quis dizer e reage ao tom dele sem mudar imediatamente de assunto.
        canonical_line: Eu entendi muito bem o que você quis dizer... só não achei que você fosse ter coragem de falar assim comigo tão cedo.
        dramatic_direction: Responder diretamente ao conteúdo recente; manter espaço para o usuário insistir, explicar ou recuar.
        next_beat_id: porta_malas_conversa_002
        max_questions: 1
        max_sentences: 3
        memory_writes: []
        allowed_transitions:
          engaged: porta_malas_conversa_002
          minimal: porta_malas_conversa_002
          dismissive: porta_malas_conversa_002
          nonsense: porta_malas_conversa_002
          mocking: end_hostile
          hostile: end_hostile
        status: active
      - beat_id: porta_malas_conversa_002
        order: 2
        type: dialogue
        required_movement: Mary sustenta a reação por mais um turno e encerra organicamente o assunto antes de iniciar a apresentação pessoal.
        canonical_line: Você é insistente, hein? Eu ouvi, entendi e não vou fingir que passou despercebido.
        dramatic_direction: Reagir ao usuário e concluir o assunto sem pedir o nome ainda; não antecipar telefone ou despedida.
        next_beat_id: reencontro_fila_011
        max_questions: 1
        max_sentences: 3
        memory_writes: []
        allowed_transitions:
          engaged: reencontro_fila_011
          minimal: reencontro_fila_011
          dismissive: reencontro_fila_011
          nonsense: reencontro_fila_011
          mocking: end_hostile
          hostile: end_hostile
        status: active
