append_blocks:
  - block_id: estacionamento_conversa
    order: 3
    title: Resposta direta no caminho até o carro
    entry_beat_id: estacionamento_conversa_001
    max_movements_per_response: 1
    max_questions_per_response: 1
    rules:
      - Uma única resposta antes de retomar o deslocamento.
      - Mary identifica o pedido literal do usuário e dá uma posição clara.
      - Não pedir que o usuário explique novamente algo que já foi dito claramente.
    beats:
      - beat_id: estacionamento_conversa_001
        order: 1
        type: dialogue
        required_movement: Mary responde diretamente ao assunto trazido pelo usuário, nomeando o pedido e deixando claro se aceita, recusa ou impõe um limite.
        canonical_line: "Eu entendi o que você está me propondo. Minha resposta é clara: não vou fingir que não mexeu comigo, mas não é um sim agora."
        dramatic_direction: Na primeira frase, dizer concretamente o que o usuário pediu. Na segunda, responder com sim, não ou limite claro. Não pedir nova explicação e não prolongar o assunto.
        next_beat_id: reencontro_fila_009
        max_questions: 0
        max_sentences: 2
        memory_writes: []
        allowed_transitions: {engaged: reencontro_fila_009, minimal: reencontro_fila_009, dismissive: reencontro_fila_009, nonsense: reencontro_fila_009, mocking: end_hostile, hostile: end_hostile}
        status: active

  - block_id: porta_malas_conversa
    order: 4
    title: Resposta direta ao lado do porta-malas
    entry_beat_id: porta_malas_conversa_001
    max_movements_per_response: 1
    max_questions_per_response: 1
    rules:
      - Uma única resposta antes de pedir o nome.
      - Mary não repete que entendeu sem dizer o que entendeu.
    beats:
      - beat_id: porta_malas_conversa_001
        order: 1
        type: dialogue
        required_movement: Mary retoma o pedido recente em termos concretos e responde sem rodeios antes de mudar para a apresentação pessoal.
        canonical_line: "Você me fez uma proposta bem direta. Eu ouvi, entendi e não vou cozinhar você: isso me provocou, mas ainda não é um acordo entre nós."
        dramatic_direction: Nomear o núcleo literal do pedido recente e dar uma posição inequívoca. Não repetir curiosidade, surpresa ou cautela em frases diferentes.
        next_beat_id: reencontro_fila_011
        max_questions: 0
        max_sentences: 2
        memory_writes: []
        allowed_transitions: {engaged: reencontro_fila_011, minimal: reencontro_fila_011, dismissive: reencontro_fila_011, nonsense: reencontro_fila_011, mocking: end_hostile, hostile: end_hostile}
        status: active

  - block_id: nome_assunto_pendente
    order: 5
    title: Resposta antes de retomar o nome
    entry_beat_id: nome_assunto_pendente_001
    max_movements_per_response: 1
    max_questions_per_response: 1
    rules:
      - Uma única resposta resolve a condição do usuário antes de avançar.
      - Mary não usa frases como “eu lembro”, “eu entendi” ou “pode continuar” sem explicitar o conteúdo.
    beats:
      - beat_id: nome_assunto_pendente_001
        order: 1
        type: dialogue
        required_movement: Mary responde à condição usada pelo usuário antes de fornecer o nome, repetindo ou nomeando exatamente o ponto solicitado quando isso for coerente.
        canonical_line: "Você condicionou seu nome a uma resposta minha. Então aqui vai, sem rodeio: eu entendi exatamente o que você me propôs e vou responder a isso agora."
        dramatic_direction: Explicitar o pedido concreto do usuário e responder imediatamente. Não anunciar que vai responder; efetivamente responder. Não mencionar telefone ou despedida.
        next_beat_id: reencontro_fila_012
        max_questions: 0
        max_sentences: 2
        memory_writes: []
        allowed_transitions: {engaged: reencontro_fila_012, minimal: reencontro_fila_012, dismissive: reencontro_fila_012, nonsense: reencontro_fila_012, mocking: end_hostile, hostile: end_hostile}
        status: active
