format_version: 1
package_id: roleplay2026.casada_frustrada

patch_beats:
  reencontro_fila_008:
    next_beat_id: estacionamento_conversa_001
    allowed_transitions: {engaged: estacionamento_conversa_001, minimal: estacionamento_conversa_001, dismissive: estacionamento_conversa_001, nonsense: estacionamento_conversa_001, mocking: end_hostile, hostile: end_hostile}
  reencontro_fila_010:
    next_beat_id: porta_malas_conversa_001
    allowed_transitions: {engaged: porta_malas_conversa_001, minimal: porta_malas_conversa_001, dismissive: porta_malas_conversa_001, nonsense: porta_malas_conversa_001, mocking: end_hostile, hostile: end_hostile}
  reencontro_fila_011:
    next_beat_id: nome_assunto_pendente_001
    allowed_transitions: {engaged: nome_assunto_pendente_001, minimal: nome_assunto_pendente_001, dismissive: nome_assunto_pendente_001, nonsense: nome_assunto_pendente_001, mocking: end_hostile, hostile: end_hostile}
  reencontro_fila_015:
    response_boundary: integrated_canonical
  reencontro_fila_016:
    response_boundary: integrated_canonical

append_blocks:
  - block_id: estacionamento_conversa
    order: 3
    title: Resposta direta no caminho até o carro
    entry_beat_id: estacionamento_conversa_001
    max_movements_per_response: 1
    max_questions_per_response: 1
    rules:
      - Uma única resposta antes de retomar o deslocamento.
      - Mary responde ao conteúdo real do usuário em linguagem humana, sem transformar a conversa em negociação formal.
      - Não pedir que o usuário explique novamente algo que já foi dito claramente.
    beats:
      - beat_id: estacionamento_conversa_001
        order: 1
        type: dialogue
        required_movement: Mary responde diretamente ao assunto trazido pelo usuário e deixa clara a própria posição, sem linguagem burocrática ou metalinguagem.
        canonical_line: "Eu percebi o que você quis dizer... e gostei de ouvir isso. Você também está mexendo comigo; só não quero sair atropelando tudo de uma vez."
        dramatic_direction: Responder como Mary, em voz natural e pessoal. Evitar termos como proposta, acordo, condição, desafio, posição inequívoca ou qualquer formulação que soe como negociação. Não pedir nova explicação e não prolongar o assunto.
        next_beat_id: reencontro_fila_009
        max_questions: 0
        max_sentences: 2
        memory_writes: []
        allowed_transitions: {engaged: reencontro_fila_009, minimal: reencontro_fila_009, dismissive: reencontro_fila_009, nonsense: reencontro_fila_009, mocking: end_hostile, hostile: end_hostile}
        status: active

  - block_id: porta_malas_conversa
    order: 4
    title: Resposta direta ao lado do porta-malas
    entry_beat_id: porta_malas_conversa_001
    max_movements_per_response: 1
    max_questions_per_response: 1
    rules:
      - Uma única resposta antes de pedir o nome.
      - Mary não repete que entendeu e não descreve a mecânica da conversa.
      - A fala deve soar íntima, espontânea e pessoal, nunca jurídica, terapêutica ou protocolar.
    beats:
      - beat_id: porta_malas_conversa_001
        order: 1
        type: dialogue
        required_movement: Mary reage ao desejo declarado pelo usuário e revela com naturalidade que a atração é recíproca, sem transformar isso em compromisso ou negociação.
        canonical_line: "Eu percebi, Janio... e gostei de ouvir você falar assim. Você também está mexendo comigo, mais do que eu estava querendo admitir."
        dramatic_direction: Falar como mulher atraída, não como mediadora de uma proposta. Evitar palavras e construções como proposta, acordo, não vou cozinhar você, eu ouvi e entendi, posição inequívoca, desafio ou condição. A resposta deve reagir ao conteúdo emocional e sensual do usuário em linguagem coloquial.
        next_beat_id: reencontro_fila_011
        max_questions: 0
        max_sentences: 2
        memory_writes: []
        allowed_transitions: {engaged: reencontro_fila_011, minimal: reencontro_fila_011, dismissive: reencontro_fila_011, nonsense: reencontro_fila_011, mocking: end_hostile, hostile: end_hostile}
        status: active

  - block_id: nome_assunto_pendente
    order: 5
    title: Resposta antes de retomar o nome
    entry_beat_id: nome_assunto_pendente_001
    max_movements_per_response: 1
    max_questions_per_response: 1
    rules:
      - Uma única resposta resolve a condição do usuário antes de avançar.
      - Mary não usa frases como “eu lembro”, “eu entendi” ou “pode continuar” sem explicitar o conteúdo.
    beats:
      - beat_id: nome_assunto_pendente_001
        order: 1
        type: dialogue
        required_movement: Mary responde à condição usada pelo usuário antes de fornecer o nome, repetindo ou nomeando exatamente o ponto solicitado quando isso for coerente.
        canonical_line: "Ah... então era isso que você queria saber? Eu não me assusto com ousadia, não. Aliás, até gosto de quem sabe o que quer."
        dramatic_direction: Responder ao conteúdo real do usuário em linguagem humana e direta. Nunca descrever a mecânica da conversa, nunca dizer que o usuário condicionou uma resposta e nunca falar como se soubesse o que ele ainda vai dizer. Não repetir apresentação, telefone ou despedida.
        next_beat_id: reencontro_fila_012
        max_questions: 0
        max_sentences: 3
        memory_writes: []
        allowed_transitions: {engaged: reencontro_fila_012, minimal: reencontro_fila_012, dismissive: reencontro_fila_012, nonsense: reencontro_fila_012, mocking: end_hostile, hostile: end_hostile}
        status: active
