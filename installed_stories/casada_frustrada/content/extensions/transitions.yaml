format_version: 1
package_id: roleplay2026.casada_frustrada
patch_beats:
  reencontro_fila_006:
    automatic_followups: []
    dramatic_direction: Encerrar este movimento e devolver obrigatoriamente o turno ao usuário. Não avançar o tempo nem iniciar o pedido de ajuda.
  reencontro_fila_007:
    required_movement: Após a resposta do usuário, passam-se alguns minutos; Mary conclui o caixa e pede que ele espere e ajude até o carro.
    canonical_line: |-
      [MINUTOS DEPOIS — SUPERMERCADO CAIXA]

      Passou rapidinho pelo caixa, hein? Chegou minha vez. Dá pra você me esperar? Vou precisar de uma mãozinha até o carro.
    dramatic_direction: A passagem temporal ocorre somente depois de uma resposta do usuário ao beat anterior. Aguardar aceite ou recusa explícita ao pedido.
    allowed_topics:
      - o atendimento no caixa
      - o pedido para esperar
      - a ajuda com as compras até o carro
    confirmed_facts:
      - alguns minutos se passaram desde que Mary avisou que era a vez do usuário no caixa
      - Mary está no caixa do supermercado
      - Mary está com compras e um carrinho de compras
      - Mary quer que o usuário espere e ajude a levar as compras até o carro
    unknown_facts:
      - o lugar exato onde o usuário deve esperar
      - a localização exata do carro
      - o conteúdo, a quantidade e o peso das compras
      - roupas e calçados
      - esforço físico, risco e urgência
    intent_classifiers:
      - intent: accept
        patterns:
          - '\b(?:não|nao)\s+(?:estou|tô|to)\s+com\s+pressa\b'
          - '\b(?:estou|tô|to)\s+sem\s+pressa\b'
          - '\bsem\s+pressa\b'
      - intent: refuse
        patterns:
          - '\b(?:não|nao)\s+(?:posso|consigo|vou|quero|dá|da)\b'
          - '\b(?:prefiro não|melhor não|não vai dar|não dá|não consigo|não quero)\b'
      - intent: postpone
        patterns:
          - '\b(?:agora não|depois|mais tarde|outra hora|estou com pressa|tô com pressa|to com pressa)\b'
      - intent: accept
        patterns:
          - '\b(?:sim|claro|beleza|com certeza|pode deixar|eu ajudo|vou ajudar|te ajudo|vamos|bora)\b'
          - '\b(?:vou esperar|espero aqui|pode contar comigo)\b'
      - intent: question
        contains: "?"
      - intent: unclear
        default: true
    transitions:
      - id: help_accepted
        priority: 100
        when:
          intent: accept
        next: reencontro_fila_008
        effects:
          facts:
            help_to_car: accepted
            _scene_location: estacionamento_caminho
        narrative_effect:
          status: decision_confirmed
          required_outcomes:
            - reconhecer o aceite
            - iniciar somente o movimento do beat alvo
          forbidden_outcomes:
            - repetir o pedido de ajuda
            - antecipar a chegada ao carro
      - id: help_refused
        priority: 100
        when:
          intent: refuse
        next: yard_help_refused_001
        effects:
          facts:
            help_to_car: refused
            _scene_location: supermercado_caixa
        narrative_effect:
          status: decision_refused
          required_outcomes:
            - reconhecer a recusa
            - respeitar a decisão sem insistir
          forbidden_outcomes:
            - avançar para o estacionamento
            - tratar a recusa como aceite
      - id: help_question
        priority: 80
        when:
          intent: question
        stay: true
        effects:
          facts:
            _scene_location: supermercado_caixa
        narrative_effect:
          status: decision_pending
          required_outcomes:
            - responder brevemente à pergunta usando apenas fatos confirmados
            - manter o pedido de ajuda aberto
            - solicitar uma decisão explícita
          forbidden_outcomes:
            - concretizar qualquer fato declarado como desconhecido
            - presumir aceite
            - avançar para o estacionamento
            - encerrar o encontro
      - id: help_postponed
        priority: 80
        when:
          intent: postpone
        stay: true
        effects:
          facts:
            _scene_location: supermercado_caixa
        narrative_effect:
          status: decision_pending
          required_outcomes:
            - reconhecer o adiamento sem tratá-lo como recusa
            - manter o pedido de ajuda aberto
            - solicitar uma decisão explícita
          forbidden_outcomes:
            - encerrar o encontro
            - desistir do pedido de ajuda
            - avançar para o estacionamento
            - presumir recusa definitiva
      - id: help_unclear
        priority: 0
        when:
          always: true
        stay: true
        effects:
          facts:
            _scene_location: supermercado_caixa
        narrative_effect:
          status: decision_pending
          required_outcomes:
            - pedir uma decisão explícita
          forbidden_outcomes:
            - presumir aceite
            - presumir recusa
            - avançar a cena
