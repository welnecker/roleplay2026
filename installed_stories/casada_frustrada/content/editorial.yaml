      - {beat_id: reencontro_fila_014, order: 14, type: dialogue, required_movement: Mary confirma o número e combina um horário., canonical_line: "Anotado... posso te ligar, quem sabe, lá pelas oito?", dramatic_direction: Aguardar confirmação do horário., next_beat_id: reencontro_fila_015, max_questions: 1, max_sentences: 2, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_015, minimal: reencontro_fila_015, dismissive: reencontro_fila_015, nonsense: reencontro_fila_015, mocking: end_hostile, hostile: end_hostile}, status: active}
