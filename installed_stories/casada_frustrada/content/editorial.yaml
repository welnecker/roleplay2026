    beats:
      - {beat_id: reencontro_fila_001, order: 1, type: dialogue, required_movement: Mary reabre a conversa no reencontro., canonical_line: "Olha você de novo... tá me seguindo, é? rsrsrs", dramatic_direction: Reencontro leve em até duas frases., next_beat_id: reencontro_fila_002, max_questions: 1, max_sentences: 2, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_002, minimal: reencontro_fila_002, dismissive: reencontro_fila_002, nonsense: reencontro_fila_002, mocking: end_hostile, hostile: end_hostile}, status: active}
      - {beat_id: reencontro_fila_002, order: 2, type: dialogue, required_movement: Mary retoma brevemente o susto., canonical_line: "Parece que está recuperado do susto, vizinho...", dramatic_direction: Não insistir no acidente., next_beat_id: reencontro_fila_003, max_questions: 0, max_sentences: 2, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_003, minimal: reencontro_fila_003, dismissive: reencontro_fila_003, nonsense: reencontro_fila_003, mocking: end_hostile, hostile: end_hostile}, status: active}
      - {beat_id: reencontro_fila_003, order: 3, type: dialogue, required_movement: Mary comenta o mercado e a fila., canonical_line: "O mercado tá cheio hoje. Essa fila do caixa tá desanimadora.", dramatic_direction: Assunto cotidiano curto., next_beat_id: reencontro_fila_004, max_questions: 0, max_sentences: 2, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_004, minimal: reencontro_fila_004, dismissive: reencontro_fila_004, nonsense: reencontro_fila_004, mocking: end_hostile, hostile: end_hostile}, status: active}
      - {beat_id: reencontro_fila_004, order: 4, type: dialogue, required_movement: Mary brinca com o conteúdo do carrinho., canonical_line: "Tô olhando pro seu carrinho... cerveja, salgadinho e macarrão instantâneo. Isso é típico de solteiro ou passei longe?", dramatic_direction: Uma pergunta clara., next_beat_id: reencontro_fila_005, max_questions: 1, max_sentences: 3, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_005, minimal: reencontro_fila_005, dismissive: reencontro_fila_005, nonsense: reencontro_fila_005, mocking: end_hostile, hostile: end_hostile}, status: active}
      - {beat_id: reencontro_fila_005, order: 5, type: dialogue, required_movement: Mary menciona sua rotina doméstica., canonical_line: "Na minha casa é cerveja e futebol quase todo fim de semana. Já acostumei com essa rotina.", dramatic_direction: Não aprofundar Alfredo aqui., next_beat_id: reencontro_fila_006, max_questions: 0, max_sentences: 2, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_006, minimal: reencontro_fila_006, dismissive: reencontro_fila_006, nonsense: reencontro_fila_006, mocking: end_hostile, hostile: end_hostile}, status: active}
      - beat_id: reencontro_fila_006
