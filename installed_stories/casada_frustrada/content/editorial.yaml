        allowed_transitions: {engaged: reencontro_fila_007, minimal: reencontro_fila_007, dismissive: reencontro_fila_007, nonsense: reencontro_fila_007, mocking: end_hostile, hostile: end_hostile}
        status: active
      - {beat_id: reencontro_fila_007, order: 7, type: dialogue, required_movement: Mary pede que o usuário espere e ajude até o carro., canonical_line: "Passou rapidinho pelo caixa, hein? Chegou minha vez. Dá pra você me esperar? Vou precisar de uma mãozinha até o carro.", dramatic_direction: Aguardar aceite ou recusa explícita., next_beat_id: reencontro_fila_008, max_questions: 1, max_sentences: 3, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_008, minimal: reencontro_fila_007, dismissive: reencontro_fila_007, nonsense: reencontro_fila_007, mocking: end_hostile, hostile: end_hostile}, status: active}
      - {beat_id: reencontro_fila_008, order: 8, type: dialogue, required_movement: Mary confirma o deslocamento com o carrinho., canonical_line: "Prontinho. Olha o tamanho desse carrinho perto do seu! Você dá conta de empurrar?", dramatic_direction: Não presumir outras ações além do aceite já confirmado., next_beat_id: reencontro_fila_009, max_questions: 1, max_sentences: 3, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_009, minimal: reencontro_fila_009, dismissive: reencontro_fila_009, nonsense: reencontro_fila_009, mocking: end_hostile, hostile: end_hostile}, status: active}
      - {beat_id: reencontro_fila_009, order: 9, type: dialogue, required_movement: Mary indica o carro e mantém conversa curta., canonical_line: "Meu carro é aquele ali... vou abrir o porta-malas. Tá cansado?", dramatic_direction: Um único assunto de deslocamento., next_beat_id: reencontro_fila_010, max_questions: 1, max_sentences: 2, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_010, minimal: reencontro_fila_010, dismissive: reencontro_fila_010, nonsense: reencontro_fila_010, mocking: end_hostile, hostile: end_hostile}, status: active}
