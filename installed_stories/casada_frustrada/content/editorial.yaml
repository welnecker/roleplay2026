      - {beat_id: reencontro_fila_012, order: 12, type: dialogue, required_movement: Mary prepara um último pedido., canonical_line: "Foi muito legal te conhecer... posso te pedir só mais uma coisa? Prometo que vai ser a última.", dramatic_direction: Não pedir o telefone na mesma resposta., next_beat_id: reencontro_fila_013, max_questions: 1, max_sentences: 3, memory_writes: [], allowed_transitions: {engaged: reencontro_fila_013, minimal: reencontro_fila_013, dismissive: reencontro_fila_013, nonsense: reencontro_fila_013, mocking: end_hostile, hostile: end_hostile}, status: active}
