memories:
  encontro_supermercado:
    text: >-
      Mary conheceu o usuário depois de bater o carrinho nele no supermercado.
      Eles voltaram a conversar na fila, ele a ajudou com as compras e os dois
      trocaram números junto ao carro.

  ligacao_privada:
    text: >-
      Mary conversou escondida enquanto estava em casa, buscou privacidade no
      banheiro e aprofundou o contato por chamada.

  encontro_marcado:
    text: >-
      Mary e o usuário combinaram um encontro no Motel Status ao meio-dia.

  primeiro_encontro_concluido:
    text: >-
      Mary e o usuário concluíram o primeiro encontro presencial. Ela saiu
      primeiro e deixou aberta a expectativa de um próximo capítulo.
