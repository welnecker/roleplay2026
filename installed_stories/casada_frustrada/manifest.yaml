  title: Casada frustrada
  subtitle: Interaja com Mary, ela quer muito te conhecer melhor. Só não abuse logo de cara, pois ela não é tão fácil.
  description: Uma história adulta de tensão emocional, escolhas e consequências, conduzida em ritmo gradual.
